name: public-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tools -p 'test_*.py'
      - run: python tools/public_export.py verify --require-public-tree

  runtime-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S recomp-runtime -B build/recomp-runtime
      - run: cmake --build build/recomp-runtime --config Debug
      - run: ctest --test-dir build/recomp-runtime -C Debug --output-on-failure
